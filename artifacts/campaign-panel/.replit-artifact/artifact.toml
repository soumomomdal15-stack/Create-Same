kind = "web"
previewPath = "/"
title = "EarnOS Campaign Panel"
version = "1.0.0"
id = "artifacts/campaign-panel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18727

[services.development]
run = "pnpm --filter @workspace/campaign-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campaign-panel", "run", "build" ]
publicDir = "artifacts/campaign-panel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18727"
BASE_PATH = "/"
